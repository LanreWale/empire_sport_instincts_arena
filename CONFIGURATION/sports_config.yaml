# ─────────────────────────────────────────────────────────
# FOOTBALL — The Beautiful Game
# ─────────────────────────────────────────────────────────
football:
  display_name: "Football"
  module: "ARENA FORGE — Football"
  icon: "⚽"
  color: "#1a5f1a"

  leagues:
    - id: "EPL"
      name: "Premier League"
      country: "England"
      season_format: "august_to_may"
      tier: "gold"
    - id: "LL"
      name: "La Liga"
      country: "Spain"
      season_format: "august_to_may"
      tier: "gold"
    - id: "BL"
      name: "Bundesliga"
      country: "Germany"
      season_format: "august_to_may"
      tier: "gold"
    - id: "SA"
      name: "Serie A"
      country: "Italy"
      season_format: "august_to_may"
      tier: "gold"
    - id: "L1"
      name: "Ligue 1"
      country: "France"
      season_format: "august_to_may"
      tier: "premium"
    - id: "UCL"
      name: "Champions League"
      country: "Europe"
      season_format: "september_to_june"
      tier: "elite"

  features:
    offensive:
      - xg_home_rolling_5
      - xg_away_rolling_5
      - xg_diff
      - possession_home_rolling
      - shots_on_target_diff
      - big_chances_home
      - big_chances_away
    form:
      - form_home_last_5
      - form_away_last_5
      - form_points_diff
      - home_advantage_factor
    h2h:
      - h2h_home_win_pct
      - h2h_goals_avg
      - h2h_btts_pct
      - h2h_over_2_5_pct
    rest:
      - rest_days_home
      - rest_days_away
      - fatigue_home
      - fatigue_away
      - congestion_home
      - congestion_away
    context:
      - league_position_diff
      - season_progress
      - relegation_pressure_home
      - title_race_pressure_home
    trends:
      - goals_scored_trend
      - goals_conceded_trend
      - clean_sheet_pct_home
      - clean_sheet_pct_away
      - btts_pct
      - over_2_5_pct
      - corner_diff
      - card_diff
    market:
      - market_implied_home_prob
      - market_implied_draw_prob
      - market_implied_away_prob
      - odds_movement_home
      - sharp_money_indicator

  markets:
    - match_result
    - over_under_2_5
    - both_teams_to_score
    - asian_handicap
    - correct_score

